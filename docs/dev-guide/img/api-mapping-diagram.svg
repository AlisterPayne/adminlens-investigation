<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Column titles -->
  <g font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="120" y="30">1. GOOGLE API</text>
    <text x="355" y="30">2. INGEST SCRIPT</text>
    <text x="590" y="30">3. SQLITE DATABASE</text>
    <text x="830" y="30">4. JSON FILE</text>
    <text x="1080" y="30">5. WEB PAGES</text>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="120" y="46">Admin SDK Reports API v1</text>
    <text x="355" y="46">ingest_generative_ai.mjs</text>
    <text x="590" y="46">adminlens.db</text>
    <text x="830" y="46">mosaic-next/data/generative_ai_data.json</text>
    <text x="1080" y="46">/generative-ai?tab=...</text>
  </g>

  <!-- 1. API streams -->
  <rect x="20" y="70" width="200" height="230" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="94" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gemini_in_workspace_apps</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="34" y="120">id.time</text>
    <text x="34" y="138">id.uniqueQualifier</text>
    <text x="34" y="156">actor.email</text>
    <text x="34" y="174">isAgenticAction</text>
    <text x="34" y="192">events[].name / type</text>
    <text x="34" y="210">param: app_name</text>
    <text x="34" y="228">param: action</text>
    <text x="34" y="246">param: event_category</text>
    <text x="34" y="264">param: feature_source</text>
  </g>
  <text x="120" y="288" font-size="9.5" fill="#3b82f6" text-anchor="middle">Docs, Gmail, Slides, Meet, Studio...</text>

  <rect x="20" y="330" width="200" height="260" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="354" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">gemini_notebook</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="34" y="380">id.time / actor.email</text>
    <text x="34" y="398">isAgenticAction</text>
    <text x="34" y="416">resourceDetails[0].id</text>
    <text x="34" y="434">resourceDetails[0].title</text>
    <text x="34" y="452">networkInfo.regionCode</text>
    <text x="34" y="470">param: visibility</text>
    <text x="34" y="488">param: source_name / type / url</text>
    <text x="34" y="506">param: studio_artifact_type</text>
    <text x="34" y="524">param: studio_artifact_name</text>
    <text x="34" y="542">events[].status.eventStatus</text>
  </g>
  <text x="120" y="574" font-size="9.5" fill="#3b82f6" text-anchor="middle">Notebooks, sources, artifacts</text>

  <!-- 2. Ingest script -->
  <rect x="265" y="70" width="180" height="520" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <g font-size="11" fill="#1e293b">
    <text x="279" y="100" font-weight="700">Step A — Fetch</text>
    <text x="279" y="118">userKey = "all"</text>
    <text x="279" y="134">maxResults = 100</text>
    <text x="279" y="150">loop nextPageToken</text>

    <text x="279" y="186" font-weight="700">Step B — Flatten</text>
    <text x="279" y="204">1 row per event in</text>
    <text x="279" y="220">item.events[]</text>
    <text x="279" y="236">id = uniqueQualifier_idx</text>

    <text x="279" y="272" font-weight="700">Step C — Save</text>
    <text x="279" y="290">INSERT OR REPLACE</text>
    <text x="279" y="306">(safe to run again)</text>

    <text x="279" y="342" font-weight="700">Step D — Count</text>
    <text x="279" y="360">totals, per app,</text>
    <text x="279" y="376">per action, per day,</text>
    <text x="279" y="392">per user, notebooks</text>

    <text x="279" y="428" font-weight="700">Step E — Write JSON</text>
    <text x="279" y="446">one file for the UI</text>

    <text x="279" y="490" font-weight="700" fill="#b45309">Runs:</text>
    <text x="279" y="508">• daily (Stage 5 of</text>
    <text x="279" y="524">  run_daily_data_pull)</text>
    <text x="279" y="542">• by hand:</text>
    <text x="279" y="558">  node ingest_generative_ai.mjs</text>
  </g>

  <!-- 3. SQLite -->
  <rect x="490" y="70" width="200" height="230" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="94" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">gemini_workspace_events</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="504" y="120">event_time</text>
    <text x="504" y="138">unique_qualifier, id</text>
    <text x="504" y="156">user_email</text>
    <text x="504" y="174">is_agentic_action (0/1)</text>
    <text x="504" y="192">event_name / event_type</text>
    <text x="504" y="210">app_name</text>
    <text x="504" y="228">action</text>
    <text x="504" y="246">event_category</text>
    <text x="504" y="264">feature_source</text>
  </g>
  <text x="590" y="288" font-size="9.5" fill="#10b981" text-anchor="middle">+ raw_json (full API record)</text>

  <rect x="490" y="330" width="200" height="260" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="354" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">gemini_notebook_events</text>
  <g font-size="10.5" fill="#1e293b">
    <text x="504" y="380">event_time / user_email</text>
    <text x="504" y="398">is_agentic_action (0/1)</text>
    <text x="504" y="416">notebook_id</text>
    <text x="504" y="434">notebook_title</text>
    <text x="504" y="452">country_code</text>
    <text x="504" y="470">notebook_visibility</text>
    <text x="504" y="488">source_name / type / url</text>
    <text x="504" y="506">studio_artifact_type</text>
    <text x="504" y="524">studio_artifact_name</text>
    <text x="504" y="542">event_status</text>
  </g>
  <text x="590" y="574" font-size="9.5" fill="#10b981" text-anchor="middle">+ raw_json (full API record)</text>

  <!-- 4. JSON keys -->
  <rect x="735" y="70" width="190" height="520" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <g font-size="11" fill="#1e293b" font-family="Consolas, Menlo, monospace">
    <text x="749" y="102">metrics</text>
    <text x="749" y="150">dailyTimeline</text>
    <text x="749" y="198">appCounts</text>
    <text x="749" y="246">actionCounts</text>
    <text x="749" y="294">categoryCounts</text>
    <text x="749" y="342">userLeaderboard</text>
    <text x="749" y="390">notebooks</text>
    <text x="749" y="410">sources, artifacts</text>
    <text x="749" y="458">recentWorkspaceEvents</text>
    <text x="749" y="478">recentNotebookEvents</text>
  </g>
  <g font-size="9.5" fill="#92400e">
    <text x="749" y="116">all KPI numbers</text>
    <text x="749" y="164">events per day</text>
    <text x="749" y="212">events per app</text>
    <text x="749" y="260">events per action</text>
    <text x="749" y="308">active / passive split</text>
    <text x="749" y="356">events per user</text>
    <text x="749" y="424">one entry per notebook</text>
    <text x="749" y="492">every event (for audit)</text>
    <text x="749" y="540" font-weight="700">Read at BUILD time.</text>
    <text x="749" y="556">Rebuild + deploy to</text>
    <text x="749" y="572">update the live site.</text>
  </g>

  <!-- 5. Pages -->
  <g>
    <rect x="970" y="70" width="210" height="110" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1075" y="92" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle">Overview</text>
    <text x="984" y="112" font-size="10" fill="#1e293b">4 KPI cards (metrics)</text>
    <text x="984" y="128" font-size="10" fill="#1e293b">Activity chart (dailyTimeline)</text>
    <text x="984" y="144" font-size="10" fill="#1e293b">App doughnut, Tasks, How used</text>
    <text x="984" y="160" font-size="10" fill="#1e293b">User Activity (userLeaderboard)</text>

    <rect x="970" y="200" width="210" height="100" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1075" y="222" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle">Gemini in Workspace</text>
    <text x="984" y="242" font-size="10" fill="#1e293b">3 KPI cards (metrics)</text>
    <text x="984" y="258" font-size="10" fill="#1e293b">Application Usage (appCounts)</text>
    <text x="984" y="274" font-size="10" fill="#1e293b">Application Features</text>
    <text x="984" y="288" font-size="10" fill="#1e293b">  (actionCounts)</text>

    <rect x="970" y="320" width="210" height="110" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1075" y="342" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle">Gemini Notebook</text>
    <text x="984" y="362" font-size="10" fill="#1e293b">3 KPI cards (metrics)</text>
    <text x="984" y="378" font-size="10" fill="#1e293b">Notebooks table (notebooks)</text>
    <text x="984" y="394" font-size="10" fill="#1e293b">Ingested Sources (sources)</text>

    <rect x="970" y="450" width="210" height="110" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1075" y="472" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle">Audit Logs</text>
    <text x="984" y="492" font-size="10" fill="#1e293b">One table with every event</text>
    <text x="984" y="508" font-size="10" fill="#1e293b">(recentWorkspaceEvents +</text>
    <text x="984" y="524" font-size="10" fill="#1e293b"> recentNotebookEvents)</text>
    <text x="984" y="540" font-size="10" fill="#1e293b">Search, 3 filters, detail view</text>
  </g>

  <!-- Arrows: API -> script -> DB -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M220 185 L263 185"/>
    <path d="M220 460 L263 460"/>
    <path d="M445 185 L488 185"/>
    <path d="M445 460 L488 460"/>
    <path d="M690 185 L733 185"/>
    <path d="M690 460 L733 460"/>
    <!-- JSON -> pages -->
    <path d="M925 110 L968 110"/>
    <path d="M925 250 L968 250"/>
    <path d="M925 390 L968 380"/>
    <path d="M925 470 L968 500"/>
  </g>

  <text x="600" y="625" font-size="11" fill="#64748b" text-anchor="middle">Auth: Service Account + Domain-Wide Delegation · Scope: https://www.googleapis.com/auth/admin.reports.audit.readonly</text>
</svg>
